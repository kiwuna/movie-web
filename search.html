<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Search — Zanora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
     <link rel="icon" href="./assets/Logos/Favico.png">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header"></header>
    <main class="catalog-page search-page">
      <p class="eyebrow">Search the archive</p>
      <h1>What are you in the mood for?</h1>
      <form class="search-large" id="search-form">
        <input
          id="search-input"
          type="search"
          placeholder="Search movies and TV shows"
          autofocus
        /><button class="button primary">Search</button>
      </form>
      <p class="result-count" id="search-summary">
        Start typing to browse TMDB.
      </p>
      <div class="catalog-grid" id="search-results"></div>
      <div class="empty-state" id="no-results" hidden>
        No results found. Try a different title or keyword.
      </div>
    </main>
    <footer>
      ZANORA <span>•</span> This product uses the TMDB API but is not
      endorsed or certified by TMDB.
    </footer>
    <div class="toast" id="toast"></div>
    
    <!-- Surprise Me Modal -->
    <div class="modal-overlay" id="surprise-modal" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Surprise Me</h2>
          <button class="modal-close" id="surprise-close">×</button>
        </div>
        <div class="modal-body" id="surprise-filters">
          <div class="filter-group">
            <label class="filter-label">Genre</label>
            <select class="filter-select" id="surprise-genre">
              <option value="">Any genre</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Minimum rating</label>
            <select class="filter-select" id="surprise-rating">
              <option value="">Any rating</option>
              <option value="5">5+ ★</option>
              <option value="6">6+ ★</option>
              <option value="7">7+ ★</option>
              <option value="8">8+ ★</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Decade</label>
            <select class="filter-select" id="surprise-decade">
              <option value="">Any decade</option>
              <option value="2020">2020s</option>
              <option value="2010">2010s</option>
              <option value="2000">2000s</option>
              <option value="1990">1990s</option>
              <option value="1980">1980s</option>
              <option value="1970">1970s</option>
              <option value="1960">1960s</option>
              <option value="1950">1950s</option>
            </select>
          </div>
          <button class="button primary modal-action" id="surprise-go">Surprise Me</button>
        </div>
        <div class="modal-body" id="surprise-result" hidden>
          <div class="surprise-loading" id="surprise-loading">Finding your movie...</div>
          <div class="surprise-movie" id="surprise-movie"></div>
          <div class="surprise-error" id="surprise-error"></div>
        </div>
      </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
    <script src="js/surprise.js"></script>
  </body>
</html>
