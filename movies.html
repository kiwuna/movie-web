<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Movies — Zanora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
     <link rel="icon" href="./assets/Logos/Favico.png">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header"></header>
    <main class="catalog-page">
      <p class="eyebrow">The collection</p>
      <h1>Movies worth losing time to.</h1>
      <p class="intro">Discover real titles from TMDB.</p>
      <div class="filters">
        <input
          id="catalog-search"
          type="search"
          placeholder="Search movies"
        /><select id="genre-filter">
          <option value="">All genres</option></select
        ><select id="year-filter">
          <option value="">Any year</option></select
        ><select id="sort-filter">
          <option value="popular">Most popular</option>
          <option value="rating">Highest rated</option>
          <option value="newest">Newest first</option>
        </select>
      </div>
      <p class="result-count" id="result-count"></p>
      <div class="catalog-grid" id="catalog-grid"></div>
      <nav class="pagination" id="pagination" hidden></nav>
      <div class="empty-state" id="empty-state" hidden>
        No movies found.<br /><button class="text-button" id="clear-filters">
          Clear filters
        </button>
      </div>
    </main>
    <footer>
      ZANORA <span>•</span> This product uses the TMDB API but is not
      endorsed or certified by TMDB.
    </footer>
    <div class="toast" id="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/movies.js"></script>
  </body>
</html>
